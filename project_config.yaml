platform: maixcam1   # MaixCAM-Pro(cv181x) · 回移植分支 feat/maixcam1-port

# ---- 显示输出（只影响 LCD；日志与协议推流完全不受影响）----
# ⚠ 关于 show() 的代价（2026-10-09 用真机日志**校正**了早前注释）:
#   早前这里写"墙上 35.6ms / 差额 32ms 持 GIL 等硬件", 但 s.log（真机 CAM1,
#   TARGET 模式, 常态化运行）实测的是**完全不同的量级**:
#       [PERF] lcd show 1.0Hz avg=2.3~6.2ms (cpu 2.1~3.2ms)
#   即单次 show ≈ 2~6ms、差额仅 0~3ms, 十几次采样全部如此。
#   视觉线程行也印证: `[PERF] vision ... disp=0.1ms` —— 带框绘制的真实代价极小。
#   结论: **32ms 那条是早期/异常条件下的单次测量, 不是固有属性**。按 6ms 算,
#   10Hz 也只占每秒 ~60ms, 完全可接受。判定标准始终是 `[PERF] lcd show` 那行。
#
#   false = 完全不向 LCD 输出（比赛最后一刻极限榨帧率时用）;
#   触摸急停仍可用（退出图标命中框按帧宽高算, 与上屏无关）。
display_enabled: true

# 两次 show 的最小间隔(ms)。0 = 每 2 帧一次(帧跳语义)。
#   100 = 10Hz（2026-10-09 用户要求）: 画面流畅可调试, 按实测 6ms/次 ≈ 每秒 60ms。
#   HUD **绘制**也会用同一间隔节流（VisionManager.set_hud_draw_interval, main.py
#   从本键透传）—— 避免"视觉每帧画、显示只 show 一部分"的白做绘制。
#   必须与 HUD 绘制同频, 否则画了不 show 的那几帧纯浪费。
#   提速优先/比赛时: display_enabled: false 归零; 或把本值调大(如 200/500)降频。
display_show_interval_ms: 100

# ---- 硬件看门狗（WDT）是否武装 ----
# ⚠⚠ **2026-10-09 起默认 false（不武装）**，这是一个**安全开关**，别随手打开。
#
# 台架现象: 运行期一切正常（帧率/推流/协议全绿），**一退出设备就重启**。
# 根因（MaixCDK `components/peripheral/port/linux_common/maix_wdt.cpp` 实锤）:
#   · `maix.wdt.WDT(0, ms)` 构造时就 open("/dev/watchdog") + 设超时 ⇒ **构造即自动启动**，
#     硬件倒计时立刻开始（本项目窗口 10s）;
#   · `WDT::stop()` 是**空实现** —— 只打一行 "this operation is not supported" 然后 `return 0`
#     （返回 0 表示 ERR_NONE，所以调用方**分辨不出**它其实什么都没做）;
#   · Linux 看门狗在 close 时若没写魔法字符 'V' 就保持运行（内核还会 print
#     `watchdog0: watchdog did not stop!`）⇒ **进程退出不会让它停**。
#   喂狗只来自三个 Python 线程（主循环/协调器/视觉），进程一退出三者全没
#   ⇒ 10s 后 SoC 硬复位 = 设备重启。所以这不是崩溃，是看门狗到点。
#
# false = 不武装: 退出干净利落，不再莫名重启（MaixVision/SSH 也不会断线）。
#         代价 = 失去"线程死锁 → 硬件自动复位"的兜底，卡死时需人工断电。
# true  = 武装（仅在你确实需要死锁兜底时用）: **必须接受"每次退出后 ~10s 设备重启"**，
#         除非该固件的 /dev/watchdog 允许 DISABLECARD（退出时 app/main.py 会尝试，
#         并把真实结果打进日志）。判别办法: 在设备上跑 `python scripts/wdt_probe.py info`
#         看 nowayout（=1 ⇒ 内核禁止停止看门狗，谁都关不掉，只能用 false 规避）。
wdt_enabled: false

# 高频性能日志闸门（默认 enabled: false = 台架调试时不再刷屏）。
#   为什么: `[PERF] vision/mainloop/lcd` × 3 + `[UART TX] DATA_STREAM` + `CMD_ACK`
#   + `[WDT] feed` + `[MEM]` 每秒各刷一条, 合起来把真正想看的信息淹掉。
#   关掉**只少打印, 不改变任何行为**: 推流帧照发、计数器照累加、log_print 仍非阻塞。
#   唯一副作用: 被吞的行不进 logs/debug.log。
#
#   enabled: false = 吞掉下面 names 里的行;  true = 逐行照打（旧行为, 定位"时间花在哪"时开）。
#   names:   子串匹配, `[PERF] vision` 或 `PERF vision` 写法都命中。
#     · [PERF] vision/mainloop/lcd show  每帧/每秒分项计时
#     · [UART TX] DATA_STREAM            推流率心跳（每秒一条）
#     · [UART TX] CMD_ACK                Brain 重订阅洪泛源
#     · [WDT] (主/协调/视觉喂狗痕迹)  · [MEM] (user/CMM)
#   ⚠ **刻意不在默认组里**（关了就看不出链路状态, 建议保留）:
#     · [UART ACTION] 门控/锁存变化   · [UART RX] 收帧
#     · [UART TX] CMD_NACK 不该 ACK 时的拒绝   · [FPS] pipeline 帧率
#
# 想全静音: names 追加 "[UART ACTION]", "[UART RX]"。想全开: enabled: true。
perf_log:
  enabled: false
  names:
    - "[PERF] vision"
    - "[PERF] mainloop"
    - "[PERF] lcd show"
    - "[UART TX] DATA_STREAM"
    - "[UART TX] CMD_ACK"
    - "[WDT] "
    - "[MEM] "

# 调试台（rich 全屏 TUI）。**2026-10-09 起默认关闭**，原因三条，全部实测/读码确认：
#   ① `utils/debug_console.py` 在**模块顶层** `import rich`。rich 是纯 Python 大包，
#      CAM1 只有 128MB 用户内存（`[MEM] user=103/128MB` = 已占 80%），导入它要
#      付内存 + 启动时间两笔账 —— 而它提供的只是一个人看的 TUI。
#   ② 渲染线程以 10Hz 重建 rich 的 Table/Panel 并往终端写整屏 ANSI：
#      构造过程**全程持 GIL**，是与视觉线程抢 GIL 的一部分（虽然不在同一线程上）。
#   ③ 它启动时会把 `sys.stdout` 换成 `ConsoleCapture` —— 此后**每一行 Python 侧
#      print 都变成一次 log_print + 一次日志文件 open/close**（`_writer_loop` 每行
#      都 open/write/flush/close）。当前没有逐帧 print 的地方，属"埋着的雷"。
# 关闭后**日志不受任何影响**：`log_print` 走的写盘线程与 `sys.__stdout__` 直写分支
# 都还在，`[PERF]` / `[UART TX]` / `[FPS]` 照常出现在控制台与 logs/debug.log。
# 台架需要 TUI 时改回 true（启动器会按本键决定是否导入 rich）。
debug_console_enabled: false

# 比赛模式开关（**当前 false = 台架行为, HUD 与 wifi 推流全开**）。
#   ⚠ 2026-10-09 改回 false: 用户要恢复带框的调试画面。恢复后 show() 的频率由
#     上面的 display_show_interval_ms(100=10Hz) 控制, HUD 绘制同频节流 ——
#     按真机实测(见文件头)每帧绘制 ~0.1ms、show ~2~6ms, 10Hz 开销可接受。
#   true  = 关掉每帧 HUD 叠加与 wifi JPEG 推流（极限榨帧率/正式比赛时用）。
#           去年 main.py task2 是单线程 read→find_blobs→send, 只画 1 个框 + 1 行字。
#   ⚠ 只影响显示: log_print 走独立写盘线程, UART DATA_STREAM 走主循环,
#     **日志与协议推流完全不受影响**。
#   ⚠ 本开关**不控制 LCD 上屏**。上屏由 display_enabled / display_show_interval_ms
#     单独控制, 两个键要一起看。
competition_mode: false

cameras:
  - camera_id: "main"
    source: null
    width: 640
    height: 480   # 与旧上端 main.py 标定几何一致（坑位 ROI/误差中心按 640 宽标定）
    fps: 60       # ⚠ CAM1 实测上限约 30fps：内部框架限制，即使 buff_num=1 也至少
                  #   双缓存、取图延时 30+ms。此处仅作期望值，勿按 60 验收推流率。
    camera_stream_queue_size: 2   # CAM1 无需堆缓冲（延时下限由固件决定）

uart_defaults:
  # MaixCAM UART0 pins A16(TX)/A17(RX) -> Brain USART1
  # A16/A17 出厂默认即 UART0_TX/UART0_RX（pinmap.md:42），**无需 set_pin_function**。
  # ⚠ UART0 的三个已知限制（MaixPy uart.md「MaixCAM/MaixCAM-Pro 串口使用注意点」）:
  #   ① 开机打印日志直到 `serial ready` —— Brain 侧必须丢弃开机段数据,
  #      否则会把启动日志当协议帧解析（协议有 AA55 帧头, 应能丢弃, 但仍建议丢弃);
  #   ② **TX(A16) 是启动模式检测引脚, 拉低 = 无法开机**。做 3.3V↔5V 电平转换时
  #      务必确保 TX 默认不拉低（保持浮空或用电平转换芯片）;
  #   ③ UART0 同时是系统默认 maix protocol 串口 —— 占用后 MaixVision IDE 的
  #      调试通道会与本链路抢线, 台架调试需改用 SSH 或断开 IDE。
  port: "/dev/ttyS0"
  baudrate: 115200     # keep 115200: official docs warn other baud rates are unreliable

ai:
  models:
    # 人质形状 YOLOv5 (yao_gu/yuan_zhu/yuan_tai) —— CVITEK .cvimodel，MaixCAM 专用格式
    # 仓库副本: assets/models/hostage_yolov5_cam1/{model_239147.mud, model_239147.cvimodel}
    # 部署到设备: cp assets/models/hostage_yolov5_cam1/* /root/models/
    # （mud 用 `model =` 键指向同目录 cvimodel，两者必须同目录同名配套）
    # 注: CAM2 的 .axmodel / nn.YOLO11 在 CAM1 上不可用，两者互不通用。
    - nick_name: "eod_hostage"
      model: "/root/models/model_239147.mud"
      model_type: "yolov5"   # CAM1 无 YOLO11 类，显式指定避免落到 "auto"歧义
  active: "eod_hostage"

streaming:
  wifi_ssid: ""
  wifi_password: ""

# 近端推流策略（GksCoordinator，v2.1 DATA_STREAM）
#   push_on_new_result: true  = 结果驱动：视觉每产出一帧结果立即推一帧，不受订阅帧
#                               min_interval_ms 限制 —— 误差/坑位"有一帧就实时输出"。
#                               interval 语义降级为"无新结果时的心跳周期"（保 Brain
#                               1s 帧龄 stale 判定 + 1s 看门狗不重订阅）。
#                               false = 回到旧的纯 interval 限速（丢中间帧，只保节奏）。
#   min_push_interval_ms: 两条放行路径共用的硬保护间隔，0 = 不限（上限由相机帧率封顶）。
#                         相机恢复/队列积压时出现突发连推就把这里调到 10~16。
# 冒烟判据: 日志 `[UART TX] DATA_STREAM <Hz>Hz` 的 Hz 应≈ `[FPS] pipeline` 的帧率。
gks_stream:
  push_on_new_result: true
  min_push_interval_ms: 0
