platform: linux

cameras:
  - camera_id: "cargo"
    # Linux:  use int index (legacy) or /dev/v4l/by-id/ stable path
    # source: "/dev/v4l/by-id/usb-Vendor_Model_SERIAL-video-index0"
    source:  "/dev/v4l/by-id/usb-HD_Camera_Manufacturer_USB_2.0_Camera-video-index0"
    width: 640
    height: 480
    fps: 120
    camera_stream_queue_size: 2
    focal_length_mm: 2.885
    sensor_width_mm: 3.6
    sensor_height_mm: 2.7

  - camera_id: "qr"
    # source: "/dev/v4l/by-id/usb-Vendor_Model_SERIAL-video-index0"
    source: "/dev/v4l/by-id/usb-Sonix_Technology_Co.__Ltd._USB_2.0_Camera_SN0001-video-index0"
    width: 640
    height: 480
    fps: 30
    camera_stream_queue_size: 2

cpu_affinity:
  enabled: true
  vision_processing: [4, 5, 6, 7]
  camera_capture: [0]
  main_loop: [1, 2]
  heartbeat: [1]
  uart_receiver: [1]
  debug_console: [1]
  opencv_threads: 4

uart_defaults:
  port: "/dev/ttyS4"
  baudrate: 115200
