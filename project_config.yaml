platform: linux

cameras:
  - camera_id: "cargo"
    source: 2
    width: 640
    height: 480
    fps: 120
    camera_stream_queue_size: 2
    focal_length_mm: 2.885
    sensor_width_mm: 3.6
    sensor_height_mm: 2.7

  - camera_id: "qr"
    source: 0
    width: 640
    height: 480
    fps: 30
    camera_stream_queue_size: 2

uart_defaults:
  port: "/dev/ttyS4"
  baudrate: 921600
