platform: maixcam2

debug_console_enabled: false
display_enabled: true

cameras:
  - camera_id: "main"
    source: null
    width: 1280
    height: 352
    fps: 60
    camera_stream_queue_size: 3
    exposure_us: 3000
    gain: 200
    aec:
      enabled: true
      adjust_interval_frames: 30   # 每N帧调整一次 (~0.5s @ 60fps)
      target_mean: 80              # ROI目标亮度 0-255, 越低越暗
      gain_min: 50                 # 增益下限, 避免过暗
      gain_max: 600                # 增益上限, 避免噪点过多
      kp: 0.5                      # PI比例系数
      ki: 0.05                     # PI积分系数
      max_i: 100                   # 积分器抗饱和钳位 [灰度级×帧]
      deadband: 8                  # 死区, |err|<=此值时跳过
      roi: [0.4, 0.7, 0.0, 1.0]   # [y0_frac, y1_frac, x0_frac, x1_frac]
      ema_alpha: 0.1               # EMA平滑系数, 越小越平滑

uart_defaults:
  port: "/dev/ttyS4"
  baudrate: 115200

ai:
  models:
    - nick_name: "yolo11n"
      model: "/root/models/steelball_1280x352.mud"
      model_type: "auto"
  active: "yolo11n"

pendulum:
  pixels_per_cm: 25.6
  length_cm: 25.0
  # rail_calibration:          # Auto-generated after Phase 2 origin calibration
  #   origin_x: 320.0
  #   origin_y: 320.0
  #   angle_rad: 0.0
