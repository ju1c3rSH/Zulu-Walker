platform: maixcam2

debug_console_enabled: false
display_enabled: true
# LCD present interval in milliseconds. Unset or zero: present each new frame,
# with the effective rate governed by frame freshness in the vision thread and
# the sink. Positive: throttle presentation and align the vision-side HUD
# rebuild window to the same period, with a 33 ms floor, so the HUD is not
# redrawn for frames that will never be presented. The MaixCAM2 panel runs at
# full rate by default; set 100 for a slower panel or to reduce GIL contention.
# display_show_interval_ms: 100

display:
  detection_list: false              # Draw the per-detection text list; disable in competition to avoid per-frame draw_string cost.

fill_light:
  start_on: false                      # Initial fill-light state. Button toggles update in-memory state only; no state file is read at startup.
  icon_on: "assets/flashlight_on.png"   # 48x48
  icon_off: "assets/flashlight_off.png" # 48x48

cameras:
  - camera_id: "main"
    source: null
    width: 1280
    height: 352
    fps: 60
    camera_stream_queue_size: 3
    # Exposure and gain are set on top of the ISP's own AE loop, so the
    # usable range is narrow: at 3000 us the settled frame is too dark
    # (mean 71, 5th percentile 0 - crushed blacks); 20000 us settles near
    # mean 126 (5th percentile 44, 95th percentile 192) and is the value
    # the AEC loop can hold on top of.
    exposure_us: 20000
    gain: 200
    aec:
      enabled: true
      adjust_interval_frames: 60   # Frames between gain adjustments (~1 s at 60 fps).
      target_mean: 120             # Target mean grayscale of the ROI, 0-255.
      gain_min: 100                # Lower gain bound; below it the frame goes dark.
      gain_max: 1600               # Upper gain bound; higher values add noise.
      kp: 0.5                      # Proportional term of the gain controller.
      ki: 0.05                     # Integral term of the gain controller.
      max_i: 100                   # Clamp for the accumulated grayscale error.
      deadband: 8                  # Skip adjustment when |error| is at most this value.
      roi: [0.4, 0.7, 0.0, 1.0]   # Sampling window as [y0, y1, x0, x1] fractions of frame height and width.
      ema_alpha: 0.1               # Smoothing factor applied to the measured ROI mean.

uart_defaults:
  port: "/dev/ttyS4"
  baudrate: 921600

ai:
  # 引擎是部署配置，不是代码分支：显式指定一个，没有候选链、没有静默降级。
  # 显式指定但不可用 → 启动期直接失败，不回落。
  #
  #   maix_nn      板端 NPU，走内核：工件、标签、帧契约都由 manifest 决定
  #   （留空）      平台自带后端：直连固件的 maix.nn，只读 .mud，不读 manifest
  #
  # 两者都满足 AIInference，因此调用方不需要按平台分支。
  engine: "maix_nn"
  switch_timeout_ms: 2000
  # 相机交给 AI 的帧形态。maix_nn 的 resize/norm 都烘焙在工件里，这一项
  # 不参与转换，仅作契约声明。
  frame: { color: rgb, dtype: uint8, layout: hwc }

  models:
    - nick_name: "yolo11n"
      # 必须是精确的工件文件，不接受目录；且必须与 manifest 里
      # artifacts.maix_nn.file 指向同一个文件，否则 add() 阶段报错。
      model: "/root/models/steelball_1280x352/steelball_1280x352.mud"
      manifest: "/root/models/steelball_1280x352/manifest.yaml"
      # model_type 在 kernel 路径下不参与判定（family 由 manifest 决定），
      # 保留它是为了让同一份配置在两条路径间切换时不用改结构。
      model_type: "auto"
  active: "yolo11n"

battery:
  enabled: true              # Disable to skip all sampling and its I2C transaction.
  poll_interval_ms: 10000    # Sampling period; the platform's min_poll_s takes precedence when longer.
  low_percent: 20            # Percentage below which the snapshot is flagged low.

streaming:
  wifi_mode: "ap"           # "ap" | "sta" | "off"
  ap_ssid: "Zulu-Walker"
  ap_password: ""           # Set a local password; never commit a real credential.
  sta_ssid: ""
  sta_password: ""
