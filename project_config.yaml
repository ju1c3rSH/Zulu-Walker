platform: maixcam2

debug_console_enabled: false
display_enabled: true

cameras:
  - camera_id: "main"
    source: null
    width: 640
    height: 640
    fps: 60
    camera_stream_queue_size: 3

uart_defaults:
  port: "/dev/ttyS4"   # MaixCAM2 UART4 pins A21(TX)/A22(RX) -> panzer UART4
  baudrate: 115200     # keep 115200: official docs warn other baud rates are unreliable

ai:
  models:
    - nick_name: "yolo11n"
      model: "/root/models/steelball_640_v4.mud"
      model_type: "auto"
    # EOD custom models go here once trained (see docs/eod/method_selection.md):
    # - nick_name: "eod_hostage"
    #   model: "/root/models/eod_hostage_320.mud"
    #   model_type: "auto"
  active: "yolo11n"

streaming:
  wifi_ssid: ""
  wifi_password: ""
