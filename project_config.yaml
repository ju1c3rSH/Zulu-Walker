platform: maixcam2

display_enabled: true

cameras:
  - camera_id: "main"
    source: null
    width: 640
    height: 640
    camera_stream_queue_size: 3

uart_defaults:
  port: "/dev/ttyS3"
  baudrate: 115200

ai:
  mask_method: "find_blobs"
  # mask_method: "find_blobs"   # 方案A — C++ 质心+面积
  # mask_method: "numpy"      # 方案B — bbox中心+面积
  # mask_method: "none"       # 关闭（向后兼容）
  models:
    - nick_name: "yolo11n"
      model: "/root/models/steelball_640.mud"
      model_type: "auto"
  active: "yolo11n"
