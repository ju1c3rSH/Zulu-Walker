platform: maixcam1   # MaixCAM-Pro(cv181x)；when you use maixcam2

display_enabled: true   # When you set it to false, the LCD will not be initialized and used. This is useful when you want to save power or use the camera in a headless mode.

# 两次 show 的最小间隔(ms)。0 = 每 2 帧一次，100 = 10Hz；HUD 绘制同频节流
display_show_interval_ms: 100

# WatchDog in MaixCAM is a stub, your systen will crack when wdt_enabled is true for Sipeed didnt 
# implement the WDT Disable function in their firmware. So we disable it by default.
wdt_enabled: false

# perf: [PERF] 行总开关 | perf_detail: 细粒度探针 | perf_interval_s: 汇总窗口(下限 0.5)
# 删掉整段 = perf 全开 + 默认窗口(10s)
observability:
  perf: true
  perf_detail: false
  perf_interval_s: 10

# 高频日志静音名单（子串匹配）。enabled: true = 名单不生效，全部照打
perf_log:
  enabled: false
  names:
    - "[WDT] "

# we use Rich to make a TUI (text user interface) on the LCD. It is a separate thread, and can be disabled to save both CPU and Memory resources.
debug_console_enabled: false

# When you set it to true, the system will run in competition mode. In this mode, the system will not print any debug information to the console, and will not use any resources for debugging. This is useful when you want to run the system in a competition environment where performance is critical.
competition_mode: false

cameras:
  - camera_id: "main"
    source: null
    width: 640
    height: 480   
    #This is to enable the camera to be used in the application. If set to false, the camera will not be initialized and used.
    fps: 60
    camera_stream_queue_size: 2

uart_defaults:
  # This is the default UART port and baudrate used by the system. You can override these values in the specific module configuration if needed.
  port: "/dev/ttyS0"
  baudrate: 115200

battery:
  enabled: true
  poll_interval_ms: 10000
  low_percent: 20          # The sys will alarm when battery percent is lower than this value

ai:
  models:
    # CVITEK .cvimodel；CAM2 的 .axmodel / nn.YOLO11 在 CAM1 不可用，两者不通用
    # mud 用 `model =` 指向同目录 cvimodel，两者须同目录同名
    - nick_name: "eod_hostage"
      model: "/root/models/model_239147.mud"
      model_type: "yolov5"   # CAM1 无 YOLO11 类，显式指定避免落到 "auto" 歧义
  active: "eod_hostage"

streaming:
  wifi_ssid: ""
  wifi_password: ""

# VENC 是单例硬件资源，与 Display.show() 抢编码；默认关闭，开前先关 MaixVision 预览
stream:
  enabled: false
  fps: 5              # limit the fps of the stream
  quality: 80
  max_width: 320      # Downsample to this width, keep aspect ratio. 0 = no downsample

# push_on_new_result: true = 结果一产出即推，interval 降级为无新结果时的心跳周期；
#                     false = 纯 interval 限速。判据: DATA_STREAM 的 Hz 应约等于 [FPS] pipeline
# min_push_interval_ms: 两条放行路径共用的硬保护间隔，0 = 不限
gks_stream:
  push_on_new_result: true
  min_push_interval_ms: 0
