platform: maixcam1   # MaixCAM-Pro(cv181x) · 回移植分支 feat/maixcam1-port

debug_console_enabled: true
display_enabled: true

# 比赛模式开关（默认 false = 台架行为, HUD 与 wifi 推流全开）。
#   true  = 关掉每帧的显示侧开销: HUD 约 20 次 maix draw_string/draw_rect
#           （CAM1 纯软件渲染, TARGET 模式还多 6 个误差刻度标签）+ wifi JPEG 编码。
#           去年 main.py task2 单线程 read→find_blobs→send, 只画 1 个框 + 1 行字;
#           当前实现拆成视觉线程 + deque + 主循环 + 显示四段, 这些绘制串在
#           取帧→推流的同一拍里, 直接表现为打靶误差滞后。
#   ⚠ 只影响显示: log_print 走独立写盘线程, UART DATA_STREAM 走主循环,
#     **日志与协议推流完全不受影响**, 台架验收照旧看 [FPS] pipeline 与
#     [UART TX] DATA_STREAM 的 Hz。
#   保留: 画面照常上屏（显示线程拿 _display_frame）、退出图标照画（触摸急停）。
competition_mode: true

cameras:
  - camera_id: "main"
    source: null
    width: 640
    height: 480   # 与旧上端 main.py 标定几何一致（坑位 ROI/误差中心按 640 宽标定）
    fps: 60       # ⚠ CAM1 实测上限约 30fps：内部框架限制，即使 buff_num=1 也至少
                  #   双缓存、取图延时 30+ms。此处仅作期望值，勿按 60 验收推流率。
    camera_stream_queue_size: 2   # CAM1 无需堆缓冲（延时下限由固件决定）

uart_defaults:
  # MaixCAM UART0 pins A16(TX)/A17(RX) -> Brain USART1
  # A16/A17 出厂默认即 UART0_TX/UART0_RX（pinmap.md:42），**无需 set_pin_function**。
  # ⚠ UART0 的三个已知限制（MaixPy uart.md「MaixCAM/MaixCAM-Pro 串口使用注意点」）:
  #   ① 开机打印日志直到 `serial ready` —— Brain 侧必须丢弃开机段数据,
  #      否则会把启动日志当协议帧解析（协议有 AA55 帧头, 应能丢弃, 但仍建议丢弃);
  #   ② **TX(A16) 是启动模式检测引脚, 拉低 = 无法开机**。做 3.3V↔5V 电平转换时
  #      务必确保 TX 默认不拉低（保持浮空或用电平转换芯片）;
  #   ③ UART0 同时是系统默认 maix protocol 串口 —— 占用后 MaixVision IDE 的
  #      调试通道会与本链路抢线, 台架调试需改用 SSH 或断开 IDE。
  port: "/dev/ttyS0"
  baudrate: 115200     # keep 115200: official docs warn other baud rates are unreliable

ai:
  models:
    # 人质形状 YOLOv5 (yao_gu/yuan_zhu/yuan_tai) —— CVITEK .cvimodel，MaixCAM 专用格式
    # 仓库副本: assets/models/hostage_yolov5_cam1/{model_239147.mud, model_239147.cvimodel}
    # 部署到设备: cp assets/models/hostage_yolov5_cam1/* /root/models/
    # （mud 用 `model =` 键指向同目录 cvimodel，两者必须同目录同名配套）
    # 注: CAM2 的 .axmodel / nn.YOLO11 在 CAM1 上不可用，两者互不通用。
    - nick_name: "eod_hostage"
      model: "/root/models/model_239147.mud"
      model_type: "yolov5"   # CAM1 无 YOLO11 类，显式指定避免落到 "auto"歧义
  active: "eod_hostage"

streaming:
  wifi_ssid: ""
  wifi_password: ""

# 近端推流策略（GksCoordinator，v2.1 DATA_STREAM）
#   push_on_new_result: true  = 结果驱动：视觉每产出一帧结果立即推一帧，不受订阅帧
#                               min_interval_ms 限制 —— 误差/坑位"有一帧就实时输出"。
#                               interval 语义降级为"无新结果时的心跳周期"（保 Brain
#                               1s 帧龄 stale 判定 + 1s 看门狗不重订阅）。
#                               false = 回到旧的纯 interval 限速（丢中间帧，只保节奏）。
#   min_push_interval_ms: 两条放行路径共用的硬保护间隔，0 = 不限（上限由相机帧率封顶）。
#                         相机恢复/队列积压时出现突发连推就把这里调到 10~16。
# 冒烟判据: 日志 `[UART TX] DATA_STREAM <Hz>Hz` 的 Hz 应≈ `[FPS] pipeline` 的帧率。
gks_stream:
  push_on_new_result: true
  min_push_interval_ms: 0
