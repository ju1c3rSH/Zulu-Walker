# Opt-in architecture guardrails (BRANCH-03). Install with:
#   pip install pre-commit && pre-commit install
# Both checks also run standalone:
#   python scripts/check_platform_isolation.py
#   python -m unittest discover -s tests
repos:
  - repo: local
    hooks:
      - id: platform-isolation
        name: no maix/cv2/serial imports outside hal/platforms
        entry: python scripts/check_platform_isolation.py
        language: system
        types: [python]
        pass_filenames: false
      - id: compile-all
        name: py_compile whole tree
        entry: python -m compileall -q app framework modules utils tests scripts
        language: system
        types: [python]
        pass_filenames: false
      - id: unit-tests
        name: stdlib unit tests
        entry: python -m unittest discover -s tests
        language: system
        types: [python]
        pass_filenames: false
