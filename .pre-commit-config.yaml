# Opt-in architecture checks. Install with:
#   pip install pre-commit && pre-commit install
# Every hook also runs standalone:
#   python scripts/check_platform_isolation.py
#   python scripts/check_boot_scope.py
#   python -m compileall -q app framework modules utils tests scripts
#   python -m unittest discover -s tests
repos:
  - repo: local
    hooks:
      - id: platform-isolation
        name: platform and engine libraries only in their allowed directories
        entry: python scripts/check_platform_isolation.py
        language: system
        types: [python]
        pass_filenames: false
      - id: boot-scope
        name: no use-before-def locals in app/main.py
        entry: python scripts/check_boot_scope.py
        language: system
        types: [python]
        pass_filenames: false
      - id: compile-all
        name: py_compile whole tree
        entry: python -m compileall -q app framework modules utils tests scripts
        language: system
        types: [python]
        pass_filenames: false
      - id: unit-tests
        name: stdlib unit tests
        entry: python -m unittest discover -s tests
        language: system
        types: [python]
        pass_filenames: false
