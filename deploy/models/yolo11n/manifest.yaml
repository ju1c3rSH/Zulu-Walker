schema_version: 3
name: yolo11n
family: yolo11

input:
  frame: { color: rgb, dtype: uint8, layout: hwc }
  size: [640, 640]
  resize: { mode: letterbox, value: 114 }
  norm: { scale: 0.00392156862745098, mean: [0, 0, 0], std: [1, 1, 1] }

labels_file: labels.txt

artifacts:
  onnxruntime:
    file: yolo11n.onnx
    wrapper: "vision.det.raw"
    wrapper_params:
      output_layout: auto
      score_activation: none
    preprocess: { resize: framework, norm: framework, formula: yolo }
    io:
      inputs: { image: "images" }
      outputs: { pred: "output0" }
    runtime:
      version: "1.26"
      providers: ["CPUExecutionProvider"]
      num_threads: 4
    build:
      tool: ultralytics-export
      source: yolo11n.pt
      opset: 17
      input_size: [640, 640]
      layout: nchw
      color: rgb
      output: raw_head

  ncnn:
    file: yolo11n.param
    bin: yolo11n.bin
    wrapper: "vision.det.raw"
    wrapper_params:
      output_layout: auto
      score_activation: none
    preprocess: { resize: framework, norm: engine, formula: substract_mean_normalize }
    io:
      inputs: { image: "data" }
      outputs: { pred: "output" }
    runtime:
      version: "1.0.20261020"
      device: cpu
      num_threads: 4
    build:
      tool: onnx2ncnn
      version: "1.0.20261020"
      source: yolo11n.onnx
      target: x86_64
      fp16: none
      int8: none
      input_size: [640, 640]
      layout: hwc
      color: rgb
      output: raw_head
