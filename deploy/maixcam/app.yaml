id: zulu_framework
name: zulu_framework
version: 0.1.0
icon: app.png
author: your-team
desc: Device package for a project built on the zulu framework.
desc[zh]: 基于本框架的项目设备打包清单模板

# Usage
# maixpack expects app.yaml and the firmware entry main.py at the repository root:
#   1. Copy app.yaml and main.py from deploy/maixcam/ to the repository root.
#   2. Adjust the files list below (default: framework core, no detectors).
#   3. Run maixpack from the repository root.
# Entries in files take precedence over exclude. A complete working example is
# at the repository root of the release/2026H branch.
#
# To package the line-follow detector:
#   a) add modules\zw_opencv_module\detectors\line_detector to files
#   b) add modules\zw_opencv_module\processors\line_follow_processor.py to files
#   c) call enable_optional(["LineFollowProcessor"]) from your project code
#      before the pipeline starts; nothing in the framework calls it for you

exclude:
  - .git
  - .gitignore
  - __pycache__
  - .vscode
  - .claude
  - stories
  - docs
  - requirements*
  - logs
  - tests
  - scripts
  - archive
  - deploy

