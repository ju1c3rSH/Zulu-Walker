# Camera System Configuration
# 检测方法说明:
#   contour_ellipse: 轮廓检测 + 椭圆拟合（颜色二值化）
#   edge_contour_ellipse: 边缘检测 + 椭圆拟合（无需颜色二值化，使用Canny+膨胀）
#   hough_ellipse: 霍夫椭圆变换（较慢）
#   hough_circle: 霍夫圆变换
system:
  output_width: 640
  output_height: 480
  layout: "grid"  # grid, horizontal, vertical
  enable_streaming: False  # 是否启用RTMP推流
  rtmp_url: "rtmp://192.168.31.158/live/livestream"
  enable_local_display: True  # 是否启用本地显示窗口（需要X11环境）
  enable_debug_window: True  # 是否启用调试窗口（参数调节）

cameras:
  - id: "cam_0"
    source: 0
    width: 640
    height: 480
    enabled: true
    preprocess:
      gaussian_blur:
        enabled: false
        kernel_size: 5
        sigma: 1.5
    tasks:
      - name: "circle_detect"
        type: "CircleTargetProcessor"
        enabled: true
