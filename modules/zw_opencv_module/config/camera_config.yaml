# Camera System Configuration
system:
  output_width: 640
  output_height: 480
  layout: "grid"  # grid, horizontal, vertical
  enable_streaming: False  # 是否启用RTMP推流
  rtmp_url: "rtmp://192.168.31.158/live/livestream"
  enable_local_display: True  # 是否启用本地显示窗口（需要X11环境）

cameras:
  - id: "cam_0"
    source: 0
    width: 640
    height: 480
    enabled: true
    gaussian_blur:
      enabled: true
      kernel_size: 5
      sigma: 1.5
    tasks:
      - name: "circle_detect"
        type: "CircleTargetProcessor"
        enabled: true
