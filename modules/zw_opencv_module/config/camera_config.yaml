# Camera System Configuration
system:
  output_width: 1280
  output_height: 720
  layout: "grid"  # grid, horizontal, vertical
  enable_streaming: false  # 是否启用RTMP推流
  rtmp_url: "rtmp://localhost/live/stream"

cameras:
  - id: "cam_0"
    source: 0
    width: 640
    height: 480
    enabled: true
    tasks:
      - name: "qr_detect"
        type: "QRProcessor"
        enabled: true

  - id: "cam_1"
    source: 1
    width: 640
    height: 480
    enabled: true
    tasks:
      - name: "cargo_detect"
        type: "CargoProcessor"
        enabled: false
