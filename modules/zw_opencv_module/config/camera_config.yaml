system:
  output_width: 544
  output_height: 544
  layout: "grid"
  enable_streaming: False
  enable_local_display: True

cameras:
  - id: "cam_main"
    source: 0
    width: 544
    height: 544
    camera_stream_queue_size: 2
    enabled: true
    tasks:
      - name: "ai_inference"
        type: "AIInferenceProcessor"
        enabled: true
      - name: "line_follow"
        type: "LineFollowProcessor"
        enabled: true
