# Camera System Configuration
system:
  output_width: 1280
  output_height: 720
  layout: "grid"  # grid, horizontal, vertical
  enable_streaming: True  # 是否启用RTMP推流
  rtmp_url: "rtmp://192.168.31.158/live/livestream"

cameras:
  - id: "cam_0"
    source: 0
    width: 640
    height: 480
    enabled: true
    tasks:
      - name: "circle_detect"
        type: "CircleTargetProcessor"
        enabled: true
