# GKS2026 near-cam 配置 — 仅 gks: 段；GksTaskProcessor.load_gks_config 浅合并覆盖代码默认值。
# LAB 阈值现场标定经 run.py debug color 调参页写入 /my-threshold 热重载, 此处为兜底/初值。
gks:
    pit_left_is_1: true   # True=画面左(小x)=坑1; 摄像头镜像/背装导致左右相反时改 false
    pit_latch_frames: 2   # 连续 N 帧左右序一致才锁存坑位（main.py 硬编码 2）
    # 脱机调阈值工具产出的运行时阈值文件（组序: 0..2 爆红/爆绿/爆蓝, 3..5 靶红/靶绿/靶蓝）;
    # 文件 mtime 变化自动重载且不清锁存。置空 "" 可禁用文件覆盖。
    thresholds_file: /my-threshold/my_64threshold.txt
    explosive:            # 0x01 爆炸物: 三色 find_blobs
      # 面积门槛 2026-09-26 下调: 10000 -> 4000。
      #   10000 px ≈ 100x100 ≈ 画面 3.3%（2025 main.py 原值, 对应他们那套机位/距离）;
      #   我们的机位下目标更小, 且运动模糊/边缘掉像素会先啃掉一圈 —— 静止调参页看得见
      #   (调参页只要 area>=200) 但主流程 found=0, 就是这个门槛卡住的。
      #   注: 与 scan_scale 叠加时代码按 scale² 折算(0.5 -> 小图 1000 像素), 物理口径不变。
      #   精调: 台架静止读调参页 `max:{area}px`, 门槛取其 40~50%。
      #   回归信号: 若出现"画面里没有目标却 found=1", 说明背景成块了 —— 往回加到
      #   6000~8000, 或先收紧该色的 A/B 轴(见下 lab 段), 别只靠加门槛。
      pixels_threshold: 4000
      area_threshold: 4000
      # 顺序来源 / 未见者补位 (语义同 rescue 段注释):
      #   2025 方案 task1 也是"首次检出先后 + 缺色用 6-a-b 推出来"。
      #   2026-09-24 台架决策: 排爆**使用推断** (infer_missing: tail, 与 2025 方案一致)
      #   —— 见到 2 色即锁, 未见者补到顺序尾部。
      # ⚠ 代价(台架必核对): 补位只推出"是什么"、推不出"在第几坑"; 一旦"未见者 =
      #   最后一个坑"不成立, 会**静默锁错坑 -> 转台打错坑 -> 抓错**, 比锁不上更危险。
      #   核对手段: 日志出现 `latch … inferred=True` 时必须拿实物核对 PIT/POS
      #   （2026-09-24 日志实测: seen=[2,3] 就锁了 pit=2, inferred=True）。
      #   要退回保守行为改成 none(三色齐见才锁, 锁不上会超时 FAULT, 可见可诊断)。
      order_by: first_seen
      infer_missing: tail
      # 排爆扫描降采样: 1.0 = 640x480 全帧扫描, 0.5 = 320x240。
      #   全帧三色串行 find_blobs 是排爆帧率瓶颈; 降采样后面积门槛按 scale² 折算、
      #   cx/框按 1/scale 还原到全帧坐标, 语义不变。
      #   降采样用 INTER_NEAREST 不插值(插值会把边缘混成中间色, 等于人为模糊)。
      # ⚠ 2026-10-07 台架修正: 本值原为 0.5, 依据是 **CAM2** 的 12~19fps 实测。
      #   换到 CAM1(cv181x) 后同一档位实测只有 **5.3fps(189ms/帧)** —— 降采样
      #   在 CAM1 上没兑现收益(算力弱一个量级, 瓶颈不在像素数而在每次调用的固定开销,
      #   如整图 LAB 转换 + 连通域标记)。现回到 1.0 = 与去年基准 main.py:338 裸扫
      #   一致, 先拿干净基线。要重开降采样请单独对比 [FPS] pipeline, 别沿用 CAM2 结论。
      scan_scale: 1.0
      # 排爆扫描 ROI: 帧比例 (x0, y0, x1, y1)。置空 / 删掉本键 = 全帧(与改动前一致)。
      #   ⚠ 纯提速视窗, **不改定序语义** —— 定序仍是"首次检出先后 + 同帧内按画面左右"。
      #     代价: 三坑必须同时落在 ROI 内, 任一坑被切出视野 -> 该色漏检 -> 补位(infer_missing)
      #     把它塞到尾部 -> **静默锁错坑**(比锁不上更危险)。故 ROI 必须先覆盖三坑全部,
      #     再按日志 cx/cy 收窄; 首次上机若不放心, 先置空跑一次全帧基线对照。
      #   当前初值: 画面下方一半(全宽, y 0.5~1.0), 先上机测。
      roi: [0.0, 0.5, 1.0, 1.0]
      lab:                # 2026-09-23 台架回写: 与设备 /my-threshold/my_64threshold.txt 逐字一致
        # 组序 0..2 爆红/爆绿/爆蓝, 3..5 靶红/靶绿/靶蓝; 文件存在时仍以文件为准,
        # 与本段同值 → 设备上留文件 / 删文件行为一致。
        # 取值原则: A/B 判色相与饱和度, L 只当噪声地板 —— 不建议用 L 上限排高光
        #   （白/高光 a*≈b*≈0 靠 A/B 天然排除; 用 L 上限切会连物体亮面一起切掉,
        #    色块被切成半块 -> explosive 过不了 10000 面积门槛 / target 的 cx 直接偏）。
        # ⚠ 这组值偏保守, 已知代价（现场"看得见却锁不上 / 色块切半"时按下表放开）:
        #   ① L 上限 red 80 / green 85 / blue 60: 高饱和纯色本身 L 就高（纯绿 87.7、
        #      受光面 74+; 实测绿球亮面 L 到 81）—— 绿球高光面仍可能出界, 可放到 95;
        #      蓝 60 是"只要深蓝"的代价(见下), 现场蓝目标受光变亮时要放开到 80。
        #   ② 红 A 下界 40: 砍掉红暗面（实测红暗面 A=37）;
        #   ③ 靶标段与本段逐字同值 —— 改这里记得同步下面 target.lab。
        # 绿的收紧记录(2026-09-26): 旧值 [8,67,-83,-10,-47,71] 太松 —— 全帧误命中 18570 px
        #   里 15658 px 是**低饱和淡绿/灰绿**(A -10~-25、B 0~35), 正是"淡绿也被认成绿"的原因。
        #   现按两根色度轴收口: Amax -10 -> -25（同时挡掉哑光黄 A≈-12~-20）、
        #   Bmin -47 -> 30（挡掉低饱和偏青的绿）; 代价用 Lmax 67 -> 85 补回来
        #   （球心 ROI 覆盖 28 -> 48 px, 正检 548 -> 525 基本不掉）。
        #   要更狠的选择性: [8,67,-83,-25,30,71]（误命中降到 954, 但球内少约 20%）。
        # 蓝的收紧记录(2026-09-26): 旧值 [0,80,-110,100,-66,-10] "只靠 B 一维、且 B 上界 -10
        #   离中性灰只有 10" —— 全帧误命中 5365 px 里 3644 px 是**浅蓝/淡蓝**(B -25~-5)。
        #   现按"只要深蓝"收口: Bmax -10 -> -25、Lmax 80 -> 60(深蓝即暗蓝)、A 从全开
        #   [-110,100] 收到 [-8,45](挡紫/青, 让 A 也参与判别); Bmin -66 -> -75 补住暗面 -69。
        #   代价: 球内正检 401 -> 341(-15%), 换来误命中 -69%、淡蓝 0。
        #   若现场蓝目标受光变亮导致切块: 先放开 Lmax 到 80; 要更深的蓝就换
        #   [0,50,-8,45,-75,-30](球内 328, 但球心高光 b*>-30 会被打洞, 慎与 10000 面积门槛同用)。
        red:   [0, 80, 40, 80, 10, 80]
        green: [25, 85, -80, -25, 30, 85]   # 2026-09-26 收紧: 挡淡绿/哑光黄(见上)
        blue:  [0, 60, -8, 45, -75, -25]   # 2026-09-26 收紧: 只要深蓝(见上)
    target:               # 0x02 靶标: ROI 内最大色块 -> 归一化误差
      pixels_threshold: 1000
      area_threshold: 1000
      # ---- 防误检（2026-10-08）----
      #
      # 背景: 选候选原来只有 "pixels 最大" 一个判据。pixels 只衡量"有多少红像素",
      # 完全不衡量"这是不是靶标" —— ROI 又是全宽的(下面 roi x0=0.0/x1=1.0),
      # 场景里任何成片红色区域(地面标记/标语/另一组的球)像素都可能赢过真球。
      # 而 err_fixed 是**云台闭环的控制量**, 任何单帧误检都以满幅值灌进 PID。
      #
      # ⚠ 2026-10-08 台架日志出现过 err 在 +9175 / -3946 间跳(±10000 满幅域)。
      #   [UART TX] DATA_STREAM 是**1 秒聚合**日志, 分不清"云台平滑扫过"与
      #   "单帧离散跳变" —— 要定性必须跑 scripts/bench_find_blobs.py。
      #
      # ⚠ **本段原有 roundness/density/solidity 三个形状先验阈值, 已删除**:
      #   靶标是**圆环**不是实心球, 三个判据的前提全错。内径比 k=r/R 时
      #   roundness=(1-k)/(1+k)、density=(π/4)(1-k²)、solidity=1-k²。
      #   k=0.5 的圆环 roundness=0.333, **比方块的 0.785 还低**, 按实心球定的
      #   0.5/0.4/0.85 门槛会把真环全部误杀 -> found 恒 0, 且是"看着有阈值、
      #   怎么调都不出货"的死局。另: cv2 回退路径用 RETR_EXTERNAL 会把内孔
      #   填成实心圆, PC 端 roundness=1.0 而设备端 0.33, 结论相反。
      #   日后要重引入: 先在设备上实测 k 再定阈值, 且走**带通**(上下界)而非
      #   单侧下限 —— 上界杀方块/实心色块, 下界杀细长条。
      #
      # 连续性选择: 优先取"离上一帧 cx 最近"的候选, 而非像素最多的。
      #   治"两个候选像素接近 -> 每帧赢家不同 -> err 跳变"。单候选时行为不变。
      #   ⚠ 必须与 merge=False 配对: merge=True 已把邻近块并成一个横跨框, 拿到
      #     的候选本身就是污染的、旁边那个候选也不可见, 本判据无从下手。
      prefer_continuity: false
      # 死区(err_fixed 定点, 10000=满幅): |新err-上次err| < deadband 时保持上次值。
      #   用死区而**不用滑动平均**: 打靶总时延已 ~45ms(取图30+find_blobs25+主循环
      #   2+线1.4) > 28Hz 控制周期 35ms, 再串平均会继续加相位滞后、恶化 PID
      #   相位裕度; 死区桶内保持不动, 不引入额外滞后。建议 300~500(约 1~1.6px)。
      err_deadband: 0
      # 连续确认: err 连续 N 帧落同一死区桶才认, 否则报 found=0。1=不要求。
      #   >1 时**必须**同时给 err_deadband > 0, 否则桶退化为 err 本身(=要求逐帧
      #   完全相同, 过于苛刻)。
      #   ⚠ 依赖 Brain 侧把 found=0 当"本帧无结果"回退而非报错 —— 对接时确认。
      confirm_frames: 1
      # merge: 关掉它**不是为了提速**(merge_margin=0 -> kwarg 根本不传, 它不是
      #   帧率瓶颈; CAM1 上 margin=1 曾致 5.3fps, 但那是 margin 的锅)。
      #   是为了**拿回候选集**给上面的连续性选择用。
      #   ⚠ 与 prefer_continuity 配对: merge=True 已把邻近块并成一个横跨框,
      #     候选本身就是污染的、旁边那个也不可见, 连续性无从下手。
      #     单开 merge=False 而不开 continuity, 只是把"合并框跳变"换成
      #     "选择器在候选间摇摆"。
      merge: false
      # find_blobs 的 margin（形态学膨胀半径）。0 = **不传该 kwarg**。
      #   去年基准 main.py:390 是裸 `merge=True` 不带 margin, 本项目此前硬编码
      #   margin=1 —— margin 会触发膨胀 + 连通域重标记, CAM1 上尤其贵。
      merge_margin: 0
      roi: [0.0, 0.352, 1.0, 0.763]   # 帧比例 (x0,y0,x1,y1) = main.py [0,169,640,197] @640x480
      # 靶标扫描降采样（2026-10-07）: 1.0 = 640x480 全帧扫, 0.5 = 320x240 扫。
      #   ⚠ 这是**两段式**, 不是"小图直接算误差":
      #     ① 小图只定位"有没有/在哪" —— 门槛按 scale² 折算(1000→250)、ROI 面积
      #       降到 1/scale², 这是省时间的大头;
      #     ② 拿粗框在全分辨率上开一个外扩 pad 的窄窗复扫一次, 门槛用原值 1000,
      #       **由这一次的 cx 算 err_fixed**。
      #   为什么必须两段: cx 是像素级量, 小图 ±1 像素还原到全帧就是 ±1/scale 像素,
      #   scale=0.5 时误差偏差可达 30+ LSB(实测 7031 vs 7062)。打靶是云台闭环、
      #   误差即控制量, 这点精度不能省。PC 端 test_target_downscale_error_
      #   identical_to_full_res 钉住了"逐位一致"这条不变量。
      #   背景: 去年 main.py task2 单线程 read→find_blobs→send 背靠背; 当前实现拆成
      #   视觉线程 + deque + 主循环 + HUD 四段, find_blobs 耗时直接进了推流关键路径。
      #   台架判据:
      #     · 若发现 found 偶尔变 0 而调参页里目标面积本就接近 1000 -> 把本段
      #       pixels/area_threshold 同步下调(按 scale² 折算后要能容下小图像素数),
      #       或维持 scale=1.0（当前值, 全分辨率无此问题）;
      #     · 若发现误差偶发跳一个粗框的量 -> 目标一帧内位移超出 refine_pad_px,
      #       调大该值(代价是精修窗变大、收益变小)。
      #   ⚠ 2026-10-07 台架结论: **CAM1 上默认 1.0（回到去年裸扫）**。
      #     降采样本是 CAM2 时代的优化, 但 CAM1 实测订阅后只有 5.3fps(189ms/帧),
      #     两段式的第二次全分辨率扫描把降采样省下的时间又吃回去了 —— 净收益为负。
      #     要重新开启降采样, 先单独测 scan_scale 0.5 vs 1.0 的 [FPS] pipeline 差值,
      #     别凭 PC 端数字判断（cv2 路径 SIMD 优化, PC 上量不到差异）。
      scan_scale: 1.0
      # 精修窗口相对粗框的外扩像素(全分辨率口径)。640 宽下 24 ≈ 画面 3.75%,
      #   覆盖云台闭环残差速率下的一帧位移。换分辨率需按比例调整。
      refine_pad_px: 24
      # 跨帧跟踪窄窗（2026-10-09, 默认 0 = 关闭）。
      #   打靶是**云台闭环** -> 目标帧间只移动少量像素。>0 时: 若上一帧有结果, 本帧
      #   优先只在 "上一帧 cx ± track_roi_px" 的窄窗里扫; **窄窗未命中则同一帧内回退
      #   全 ROI 复扫** —— 于是检出率与精度跟"全程全 ROI"完全一致, 跟踪只在命中时省时间。
      #   为什么值得做: find_blobs 成本≈正比于搜索面积（bench @640x480 实测
      #     640x197 = 8.96ms -> 640x120 = 5.10ms -> 640x40 = 1.53ms）, 而真机带目标时
      #     `[PERF] task` 达 21ms —— 是全帧预算里最大的一块。pad=48 时窗口约 96x197
      #     ≈ 18.9k px（原 126k px 的 1/6.7）。
      #   ⚠ pad 取小了会频繁未命中, 净收益变负（白花一次窄窗 + 一次全 ROI）。现场按
      #     日志 `[GKS] target 跟踪窄窗未命中 xN` 的出现频率调; 命中时另有一条
      #     `target 跟踪窄窗命中 xN` 作为"确实在省时间"的证据。建议起点 48~64。
      #   ⚠ 只服务打靶。排爆要全帧三色定序（首次检出先后）、人质走 YOLO 全帧,
      #     缩小搜索域会**改语义**而不是省时间, 故不适用。
      track_roi_px: 64
      # 跟踪窗模式: off | fixed(上帧 cx±track_roi_px, 即上注释) | dynamic。
      #   dynamic: 窗宽 = min(2*track_roi_px, max(track_win_min_w, track_win_scale*blob_w)),
      #            窗高 = min(roi高, blob_h + 2*track_v_pad_px), 中心对齐上帧 (cx,cy)。
      #   横宽纵窄贴合"云台只闭环 X 轴"; 双向封顶不大于 fixed 窗, miss 成本也不高于
      #   fixed; 未命中仍当帧回退全 ROI, 结果语义不变。非法值按 fixed。
      track_mode: dynamic
      track_win_scale: 4.0
      track_win_min_w: 48
      track_v_pad_px: 16
      # 候选填充率过滤 pixels/(w*h): 环≈0.5~0.7, 实心矩形≈0.9+。全开区间=不过滤。
      #   cv2 回退路径内孔被填实(环≈0.79), max 需留余量; 阈值必须真机标定后再收。
      fill_min: 0.0
      fill_max: 1.0
      lab:                # 与 explosive 段同值（"什么是红/绿/蓝"不随任务变）
        # 现场可按 ROI 内实际光比分头标定 —— 两者物理条件不同（爆: 全帧三坑 +
        # 10000 面积门槛; 靶: 窄 ROI + 1000）, 同一组值只是起点而非最优;
        # 要分开标定就先改这里(改上面 explosive 段时注意同步)。
        red:   [0, 80, 40, 80, 10, 80]
        green: [25, 85, -80, -25, 30, 85]   # 2026-09-26 收紧: 挡淡绿/哑光黄(见上)
        blue:  [0, 60, -8, 45, -75, -25]   # 2026-09-26 收紧: 只要深蓝(见上)
    # 设备端LAB 阈值调参页(run.py debug color / KEY_OK 调试页)的分析降采样。
    #卡顿根因(2026-10-07 实测): _analyze 里 findContobs 的耗时随命中噪点数
    #   爆炸 —— PC 端低噪声 0.08ms、高噪声(11854 轮廓) 10.1ms, 差 126 倍; 再叠
    #   加逐轮廓的 Python contourArea/boundingRect 循环, 阈值一放宽就骤然卡住。
    #   CAM1(cv181x) 算力比 CAM2 弱一个量级, 叠加 30+ms 取图延时, 手感更差。
    # 办法与 explosive.scan_scale 同一套: 降采样后分析, 面积门槛按 scale² 折算、
    #   bbox 坐标按 1/scale 还原到全帧, 缩放用 INTER_NEAREST 不插值(插值会把
    #   边缘混成中间色 = 色块掉出阈值的同一机理)。判定结果不变, 只影响零碎
    #   噪点的可见粒度(1/scale 像素级)。
    # 台架判据: 信息栏末尾显示 s:<档位>x (0.5x = 半分辨率已生效)。要退回全帧
    #   对照旧行为改成 1.0。
    tuner:
      scan_scale: 0.5
    rescue:               # 0x03 人质: 三形状坑位（CAM2=YOLO11n/axmodel, CAM1=YOLOv5/cvimodel）
      # 2026-11-04 现场日志: 入画边缘的圆台被判圆柱 0.59 一帧, 0.55 放过 -> 单帧即
      #   写 _shape_seen -> 集合凭空多一个"圆柱" -> pos2=[3,1,2] 静默锁错两个坑。
      #   提回 0.65 先止血; 后续 6 帧 0.80~0.92 的纠正进不来是代码侧单帧定案问题。
      conf_th: 0.65       # 2026-10-10 台架调低 0.7->0.55(提召回); 11-04 回 0.65
      iou_th: 0.45        # main.py 原值
      # 只信画面左 3/4: obj.x(左边缘) > 480 的框直接丢弃。480/640 = 0.75W。
      #   与 25 版 main.py:257 的 `obj.x > 240`、26 版 main.py:435 的
      #   `TASK3_CROP_X_MAX = 240` 是**同一个判据的两个分辨率写法** ——
      #   模型是同一份（model_239147.cvimodel 三处 md5 均 4aec1229…，
      #   输入 224×224 letterbox，320 图和 640 图缩到模型后等价）。
      # 作用: 目标从右边缘入画时半出画 + 运动模糊，首帧容易被判成邻类。这条把
      #   入画区整段挡掉，等目标走进稳定区再入表 —— 2026-11-04 的幽灵帧
      #   yuan_zhu=0.59(570) 左边缘 530 > 480，会被直接 continue。
      # 与 shape_hits(feat/rescue-shape-streak 分支) 互补: 这条是位置判据、不依赖
      #   帧率; shape_hits 是时间判据、不限位置。两条可单独台架，也可叠加。
      # 代价: pit1/pit2 各要往左多走 1~2 帧才可用（11-04 日志口径，每坑 30~50 帧）。
      #   ⚠ 车停在 x>520 时该坑永远不通过 -> 不入表 -> tail 补位会错，先查相机是否没动。
      #   ⚠ obj.x 是左边缘不是中心: 框宽 80 -> cx 520 为界; 框宽 120 -> cx 540 为界。
      # 置 0 回全视野（未标定机位时的安全值）。
      x_crop_px: 480
      # ⚠ 运行时覆盖: 人质调参页 SAVE 会写 /my-threshold/my_rescue_params.txt
      #   (conf_th/iou_th/x_crop_px 逐行 key=value), 本文件保持只读 ——
      #   文件存在时以文件为准, mtime 变化热重载、不清锁存（语义同 my_64threshold.txt）。
      # 坑位顺序来源:
      #   first_seen = 首次检出先后即坑位顺序（默认）。比赛流程固定, 相机按 pit1→pit3
      #                方向扫过, 所以"最先看见的那个就在 pit1"; 跨帧顺序是物理顺序,
      #                与图像左右无关。同一帧里同时检出多个时, 帧内按画面左右定序
      #                （受 pit_left_is_1 影响), 保证结果不受 YOLO 输出顺序影响。
      #   x          = 全程按画面 x 从左到右排序（旧 main.py 语义, 三坑同屏时用;
      #                背装镜像需把 pit_left_is_1 置 false 做整体翻转）。
      order_by: first_seen
      # 未见形状补位规则: 三坑形状互不相同, 见到 2 个即可推出第 3 个"是什么"。
      #   tail = 未见者=顺序上的最后一个坑, 补在尾部（默认, 配合 first_seen 即 pit3）
      #   none = 不补位, 必须三形状齐见才锁存 (旧 main.py 语义, 退路)
      # 现场务必用 HUD/日志的 "latch ... inferred=True" 确认补位被触发且 POS 与实物一致;
      # 不一致说明"未见者=最后一个坑"不成立 -> 置 none 退回安全行为(锁不上会 FAULT,
      # 但不会静默抓错人质)。
      infer_missing: tail
      # 新形状"入表"所需的**连续在场帧数**（缺席一帧即清零重计）。
      #   2026-11-04 现场: 目标从右侧入画首帧被判成邻类（yuan_zhu 0.59 而非
      #   yuan_tai），下一帧起 0.80~0.92 全对 —— 旧代码首帧即写 _shape_seen、
      #   永久占位，集合凭空多一个形状 -> 三形状"齐见" -> 静默锁错两个坑。
      #   3 = 幽灵必须连续错 3 帧才能占坑（覆盖现场的 1 帧 / 偶发 2 帧）。
      #   1 = 旧"首帧定案"（代码默认值，也是单测基线，勿在两处同时改）。
      #   ⚠ 代价: 锁存最早推迟到第 shape_hits + pit_latch_frames - 1 = 4 帧。
      #   ⚠ 每坑在画 30~50 帧时只吃掉 6~10% 窗口; 若台架日志 peak= 长亮（说明
      #     真坑可见帧数不够），先降回 2，不要往上加。
      shape_hits: 3
      labels:             # model.mud labels: yao_gu, yuan_zhu, yuan_tai -> 形状号
        yuan_zhu: 1
        yuan_tai: 2
        yao_gu: 3
