gks:
    pit_left_is_1: true   # 画面左=坑1；镜像/背装左右相反时改 false
    pit_latch_frames: 2   # 连续 N 帧同序才锁；调大更稳但更慢
    # 脱机工具产出的阈值文件；mtime 变化重载且不清锁存，置空禁用覆盖
    thresholds_file: /my-threshold/my_64threshold.txt
    explosive:            # 0x01 爆炸物
      # 面积门槛取调参页 max:area 的 40~50%；背景成块误检时加到 6000~8000 或收紧 A/B
      pixels_threshold: 4000
      area_threshold: 4000
      # 见到 2 色即锁、未见的补尾部；inferred=True 时须实物核对坑位
      # 现场对不上改 none：三色齐见才锁，锁不上会超时 FAULT
      order_by: first_seen
      infer_missing: tail
      # 0.5=半分辨率提速；CAM1 上无收益，改前先对比 [FPS] pipeline
      scan_scale: 1.0
      # 帧比例 (x0,y0,x1,y1)，置空或删键=全帧；三坑必须同时在视窗内，否则漏检后补位会锁错坑
      roi: [0.0, 0.5, 1.0, 1.0]
      lab:                # 设备阈值文件优先；改这里同步 target.lab
        # A/B 管色相与饱和度，L 只作噪声地板；高光靠 A/B 排除，别用 L 上限切
        # 现场锁不上或色块切半，再按色放开 L 或 A
        red:   [0, 80, 40, 80, 10, 80]
        green: [25, 85, -80, -25, 30, 85]   # 挡淡绿/哑光黄
        blue:  [0, 60, -8, 45, -75, -25]    # 只要深蓝
    target:               # 0x02 靶标：ROI 内色块 -> 归一化误差
      pixels_threshold: 1000
      area_threshold: 1000
      # 多候选时取离上帧最近者治 err 跳变；需配 merge: false
      prefer_continuity: false
      # 300~500 可平滑抖动；confirm_frames>1 时须同时设 deadband>0，否则要求逐帧完全相同
      err_deadband: 0
      confirm_frames: 1
      # 关掉是为给 prefer_continuity 留候选集，单开没意义
      merge: false
      # 0=不传；膨胀会加重连通域标记，CAM1 上很贵
      merge_margin: 0
      roi: [0.0, 0.352, 1.0, 0.763]
      # 0.5=小图定位再全分辨率精修，当前 1.0；改前先测 [FPS]
      scan_scale: 1.0
      # 精修窗外扩，按 640 宽标定；换分辨率按比例调
      refine_pad_px: 24
      # >0 开跨帧跟踪窄窗，未命中当帧回退全 ROI；只服务打靶
      track_roi_px: 64
      # off | fixed(上帧 cx 加减 track_roi_px) | dynamic(随 bbox 缩放)，非法值按 fixed
      track_mode: dynamic
      track_win_scale: 4.0
      track_win_min_w: 48
      track_v_pad_px: 16
      # 环约 0.5~0.7、实心约 0.9+；全开=不过滤，收窄前先真机标定
      fill_min: 0.0
      fill_max: 1.0
      lab:                # 与 explosive 段同值；分开标定时改这里并同步上面
        red:   [0, 80, 40, 80, 10, 80]
        green: [25, 85, -80, -25, 30, 85]
        blue:  [0, 60, -8, 45, -75, -25]
    # 调参页分析降采样；信息栏 s:0.5x 显示生效档位，改 1.0 回全帧
    tuner:
      scan_scale: 0.5
    rescue:               # 0x03 人质
      # 调低会让入画边缘的圆台误判成圆柱并锁错坑
      conf_th: 0.65
      iou_th: 0.45
      # 丢弃左边缘超过 480 的框（右侧 1/4 入画区）；0=全视野
      x_crop_px: 480
      # first_seen=首次检出顺序；x=按画面左右（镜像时配合 pit_left_is_1）
      order_by: first_seen
      # tail=未见者补最后；现场 POS 对不上改 none：三形状齐见才锁
      infer_missing: tail
      # 连续在场帧数，挡入画瞬间的类别误判；1=首帧定案。真坑可见帧不足时往回调
      shape_hits: 3
      labels:             # 模型标签对应形状号
        yuan_zhu: 1
        yuan_tai: 2
        yao_gu: 3
