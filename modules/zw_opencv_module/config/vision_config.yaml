pipelines:
  - pipeline_id: "cam_qr"
    camera_id: "qr"
    tasks:
      - name: "qr_detect"
        type: "QRCodeProcessor"
        enabled: true

  - pipeline_id: "cam_cargo"
    camera_id: "cargo"
    tasks:
      - name: "track_cargo"
        type: "TrackCargoProcessor"
        enabled: false
      - name: "ring_discovery"
        type: "RingDiscoveryProcessor"
        enabled: false
