camera:
  width: 1280
  height: 352
  fps: 60

calib:
  binary_threshold: 127
  min_contour_area_ratio: 0.04
  max_contour_area_ratio: 0.55
  min_aspect_ratio: 1.0
  canny_low: 50
  canny_high: 150
  hough_threshold: 50
  hough_min_line_len: 150
  edge_angle_max_deg: 15
  column_threshold: 180

debug:
  save_frame: true
  save_binary: true
  save_column_binary: true
  draw_cm_scale: false          # c 命令运行中切换; 画模拟厘米刻度验证 pixels_per_cm
  cm_scale:
    pixels_per_cm: 50.0
    cm_interval: 1.0
    tick_len: 40
