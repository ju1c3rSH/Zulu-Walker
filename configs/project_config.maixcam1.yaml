# Runtime template for MaixCAM / MaixCAM-Pro (cv181x).
#
# Usage (leaves the workspace project_config.yaml untouched):
#     set ZWULU_CONFIG=configs/project_config.maixcam1.yaml
#     python run.py main
#
# For per-key differences from the MaixCAM2 default, see
# docs/architecture/maixcam1_platform.md.

platform: maixcam1

display_enabled: true
# The CAM1 panel is 552x368 and slower than CAM2; 100 ms gives 10 Hz for both
# HUD drawing and presentation.
display_show_interval_ms: 100

debug_console_enabled: false      # Run the Rich TUI on a separate thread to save CPU and memory.

observability:
  perf: true
  perf_detail: false
  perf_interval_s: 10

cameras:
  - camera_id: "main"
    source: null
    width: 640
    height: 480
    fps: 60
    camera_stream_queue_size: 2

uart_defaults:
  # UART0 uses A16 (TX) and A17 (RX), which already carry that function at
  # boot, so the platform layer skips pinmux setup. A16 also selects the boot
  # mode; holding it low prevents the board from starting.
  port: "/dev/ttyS0"
  baudrate: 115200

ai:
  models:
    # CAM1 loads CVITEK .cvimodel files; the .axmodel / nn.YOLO11 path used on
    # CAM2 does not work here. The .mud file points to a same-named cvimodel
    # in the same directory. Model binaries are not tracked: deploy both to
    # /root/models/ as described in docs/architecture/maixcam1_platform.md.
    - nick_name: "eod_hostage"
      model: "/root/models/model_239147.mud"
      model_type: "yolov5"   # CAM1 has no YOLO11 class; set explicitly to avoid auto-detection ambiguity.
  active: "eod_hostage"

battery:
  # The Pro's AXP2101 uses I2C-4 and a full read takes about 1.02 ms; sampling runs on the main-loop slow tick.
  enabled: true
  poll_interval_ms: 10000
  low_percent: 20

streaming:
  # zw_wifi_stream declares PLATFORMS = ("maixcam2",), so it is skipped on CAM1.
  wifi_mode: "off"
