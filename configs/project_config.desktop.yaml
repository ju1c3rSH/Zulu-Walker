# Desktop profile: a generic Linux or Windows host.
#
# Launch it with:
#   python run.py main --config configs/project_config.desktop.yaml
# or:
#   ZWULU_CONFIG=configs/project_config.desktop.yaml python run.py main
#
# The engine is explicit: the runtime has exactly one engine and never
# falls back to another one silently.

platform: linux                  # desktop hosts use the linux platform package (cv2 + pyserial)

debug_console_enabled: true     # no Rich TUI on the desktop; the OpenCV window is the view
display_enabled: true            # keep the display path alive

display:
  backend: "panel"               # cv2 window carrying the device HUD (framework/ui)
  width: 640
  height: 480
  scale: 2                       # the window is panel x scale, fixed size
  title: "Zulu-Walker"
  # interval_ms: 33              # present throttle; absent = present every tick

cameras:
  - camera_id: "main"
    source: 0                    # Windows: 0 is the first camera; Linux: resolved to a V4L2 node
    width: 640
    height: 480
    fps: 60
    camera_stream_queue_size: 2

uart_defaults:
  port: "auto"                  # the host's own serial port; no port means no UART, and the app still runs
  baudrate: 921600

ai:
  engine: "onnxruntime"         # required: one explicit engine, no candidates, no silent downgrade
  switch_timeout_ms: 2000
  frame: { color: bgr, dtype: uint8, layout: hwc }   # what the camera delivers

  # The accelerator is a property of this machine, not of the artifact, so it
  # is chosen here and merged over the runtime block of every manifest below.
  # An absent block means "take the manifest default", which is the CPU.
  #
  #   onnxruntime, NVIDIA (Win/Linux):  pip install onnxruntime-gpu     (CUDA 12.x + cuDNN 9)
  #   onnxruntime, any DX12 GPU (Win):  pip install onnxruntime-directml
  #   onnxruntime, AMD (Linux):         pip install onnxruntime-rocm
  #   ncnn, any Vulkan GPU:             device: vulkan, wheel from PyPI is already Vulkan-enabled
  #
  # Run `python scripts/check_accelerators.py` to list what this host really has.
  #
  # runtime:
  #   providers: ["CUDAExecutionProvider", "CPUExecutionProvider"]
  #   provider_options:
  #     CUDAExecutionProvider: { device_id: 0 }
  #   fallback: forbid            # forbid = a request that lands on the CPU fails at startup
  #
  # ncnn equivalent:                device picks the backend, vulkan_device the GPU
  # runtime:
  #   device: vulkan
  #   vulkan_device: auto         # auto = the device ncnn ranks first, not index 0
  #   fp16: auto

  models:
    - nick_name: "yolo11n"
      model: "deploy/models/yolo11n/yolo11n.onnx"     # the exact artifact file, not a directory
      manifest: "deploy/models/yolo11n/manifest.yaml" # the contract of the logical model
      # runtime: {...}                                # per-model override of the block above
  active: "yolo11n"

battery:
  enabled: true                 # a PC has no fuel gauge
